name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Inkwell.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Inkwell-apk
          path: Inkwell.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest Inkwell.apk --title "Inkwell (latest)" --notes "Download Inkwell.apk on your Android phone and open it to install."
