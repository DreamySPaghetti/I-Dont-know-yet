name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log
      - name: Save build log on failure
        if: failure()
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          cp build.log /tmp/build.log
          git checkout --orphan ci-log && git rm -rfq --cached . && cp /tmp/build.log build.log
          git add -f build.log && git commit -qm log && git push -f origin ci-log
      - run: cp app/build/outputs/apk/debug/app-debug.apk PixelPorters.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PixelPorters.apk
          path: PixelPorters.apk
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create "v${{ github.run_number }}" PixelPorters.apk --latest --title "Pixel Porters 1.${{ github.run_number }}" --notes "Download PixelPorters.apk on your Android phone and open it to install. No ads."
