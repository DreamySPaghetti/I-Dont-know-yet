<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#20263a">
<title>Ant Trail</title>
<style>
:root{--bg:#20263a;--panel:#2c3450;--ink:#fff;--muted:#a9b2cc;--accent:#ffc94d;--red:#ef5d5d;--green:#5fcf86;--card:#fffaf0;--cardInk:#3a3226}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#151a28;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;color:var(--ink)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#game{position:relative;width:min(100vw,calc(100vh*9/16));height:min(100vh,calc(100vw*16/9));width:min(100vw,calc(100dvh*9/16));height:min(100dvh,calc(100vw*16/9));background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hud{display:flex;align-items:center;gap:10px;padding:10px 12px 6px 16px;flex:none}
#lvl{font-weight:800;font-size:20px;letter-spacing:.2px}
.tag{display:inline-block;margin-top:2px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;background:#3f8f5d}
.tag.hard{background:#e08a2e}.tag.super{background:var(--red)}
.sp{flex:1}
#coinBox{display:flex;align-items:center;gap:6px;background:var(--panel);padding:6px 12px 6px 8px;border-radius:99px;font-weight:800;font-size:16px}
.coin{display:inline-block;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe9a3,#f5b81f 60%,#c98a0b);box-shadow:inset 0 0 0 2px rgba(150,95,0,.35)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#gear{width:40px;height:40px;border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center}
#banner{flex:none;background:var(--red);color:#fff;text-align:center;font-weight:900;letter-spacing:3px;font-size:12px;padding:3px 0}
#cv{flex:1;width:100%;min-height:0;display:block;touch-action:none}
#boosters{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 10px 12px}
.bst{position:relative;background:var(--panel);border-radius:16px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:72px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bst:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.bst svg{width:28px;height:28px}
.bst .nm{font-size:11px;font-weight:700;color:var(--muted)}
.bst .badge{position:absolute;top:-6px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--green);color:#10331d;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.bst .price{display:flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--accent)}
.bst .price .coin{width:12px;height:12px}
.bst.locked{opacity:.45}
.bst.on{outline:3px solid var(--accent)}
.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);max-width:88%;background:rgba(20,24,38,.92);color:#fff;padding:9px 14px;border-radius:14px;font-size:14px;font-weight:600;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#toast.show{opacity:1}
#mode{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);background:var(--accent);color:#2a2000;padding:8px 10px 8px 14px;border-radius:99px;font-weight:800;font-size:14px;display:none;align-items:center;gap:10px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#mode button{background:rgba(0,0,0,.15);padding:4px 10px;border-radius:99px;font-weight:800}
#overlay{position:absolute;inset:0;background:rgba(10,12,20,.6);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}
#overlay.hidden{display:none}
.hidden{display:none!important}
.card{width:100%;max-width:400px;max-height:100%;overflow:auto;background:var(--card);color:var(--cardInk);border-radius:24px;padding:22px 20px 18px;box-shadow:0 14px 40px rgba(0,0,0,.45);text-align:center;animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 6px;font-size:24px}
.card p{margin:6px 0 12px;color:#6d6252;font-size:15px;line-height:1.4}
.btn{display:block;width:100%;padding:13px;border-radius:16px;font-weight:800;font-size:17px;margin-top:10px;background:#ffc94d;color:#3a2a00;box-shadow:0 4px 0 #c99520}
.btn.alt{background:#e9e1d1;color:#4a4033;box-shadow:0 4px 0 #c8bea9}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #b53d3d}
.btn:active{transform:translateY(3px);box-shadow:none}
.stars{font-size:38px;letter-spacing:6px;color:#f5b81f;margin:4px 0}
.stars .off{color:#d9cfbd}
.reward{display:flex;justify-content:center;gap:14px;font-weight:800;margin:8px 0;align-items:center}
.pic{image-rendering:pixelated;border-radius:12px;background:#efe3c8;box-shadow:inset 0 0 0 3px #e2d3b2;margin:8px auto;display:block}
.row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #eadfca;font-weight:700}
.sw{width:50px;height:30px;border-radius:15px;background:#d7ccb7;position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:#5fcf86}.sw.on::after{left:23px}
.seg{display:flex;background:#e9e1d1;border-radius:12px;padding:3px}
.seg button{padding:6px 14px;border-radius:9px;font-weight:800;color:#6d6252}
.seg button.on{background:#fff;color:#3a3226;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.gal div{background:#efe3c8;border-radius:12px;padding:6px;font-size:11px;font-weight:700;color:#6d6252}
.gal canvas{width:100%;image-rendering:pixelated;display:block;margin-bottom:4px}
.sws{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:12px 0}
.sws button{width:54px;height:54px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 -6px 0 rgba(0,0,0,.15)}
.big{font-size:64px;line-height:1;margin:6px 0}
.big svg{width:72px;height:72px}
</style>
</head>
<body>
<div id="wrap"><div id="game">
  <div id="hud">
    <div id="lvlBox"><div id="lvl">Level 1</div><div id="tag" class="tag">Normal</div></div>
    <div class="sp"></div>
    <div id="coinBox"><span class="coin"></span><span id="coins">0</span></div>
    <button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div id="banner" class="hidden">SUPER HARD</div>
  <canvas id="cv"></canvas>
  <div id="boosters"></div>
  <div id="toast"></div>
  <div id="mode"><span id="modeTxt"></span><button id="modeCancel">Cancel</button></div>
  <div id="overlay" class="hidden"><div class="card" id="card"></div></div>
</div></div>
<script>
/*LOGIC-START*/
"use strict";
const CAPS = [5, 10, 15, 20, 25, 30, 50];
const MAX_SLOTS = 7;

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rpick = (r, a) => a[Math.floor(r() * a.length)];
function rshuffle(r, a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

// ---------- min-heap of tile indices keyed by distance to the nearest nest ----------
function hless(d, a, b) { return d[a] < d[b] || (d[a] === d[b] && a < b); }
function hpush(h, v, d) {
  h.push(v); let i = h.length - 1;
  while (i > 0) { const p = (i - 1) >> 1; const a = h[p]; if (hless(d, v, a)) { h[i] = a; i = p; } else break; }
  h[i] = v;
}
function hpop(h, d) {
  const top = h[0]; const last = h.pop(); const n = h.length;
  if (n) {
    let i = 0;
    for (;;) {
      const l = 2 * i + 1; if (l >= n) break;
      const r = l + 1; let m = l;
      if (r < n && hless(d, h[r], h[l])) m = r;
      if (hless(d, h[m], last)) { h[i] = h[m]; i = m; } else break;
    }
    h[i] = last;
  }
  return top;
}

// ---------- Board: tiles, open ground, reachability ----------
class Board {
  constructor(W, H, grid, nc, nests) {
    this.W = W; this.H = H; this.N = W * H; this.nc = nc; this.color = grid;
    this.dist = new Float32Array(this.N);
    for (let i = 0; i < this.N; i++) {
      const x = i % W + .5, y = (i / W | 0) + .5; let m = 1e9;
      for (const n of nests) { const d = Math.hypot(x - n.x, y - n.y); if (d < m) m = d; }
      this.dist[i] = m;
    }
    this.z = new Uint32Array(this.N);
    let s = 0x9e3779b9;
    for (let i = 0; i < this.N; i++) { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; this.z[i] = s >>> 0; }
    this.present = new Uint8Array(this.N); this.reserved = new Uint8Array(this.N);
    this.open = new Uint8Array(this.N); this.inHeap = new Uint8Array(this.N);
    this.heaps = []; for (let c = 0; c < nc; c++) this.heaps.push([]);
    this.left = new Int32Array(nc); this.total = 0; this.hash = 0; this.ver = 0;
    for (let i = 0; i < this.N; i++) if (grid[i] >= 0) { this.present[i] = 1; this.left[grid[i]]++; this.total++; }
    this.rebuild();
  }
  border(i) { const x = i % this.W, y = i / this.W | 0; return x === 0 || y === 0 || x === this.W - 1 || y === this.H - 1; }
  adjOpen(i) {
    const W = this.W, x = i % W, o = this.open;
    return (x > 0 && o[i - 1] === 1) || (x < W - 1 && o[i + 1] === 1) || (i >= W && o[i - W] === 1) || (i < this.N - W && o[i + W] === 1);
  }
  reachable(i) { return this.present[i] === 1 && this.reserved[i] === 0 && (this.border(i) || this.adjOpen(i)); }
  push(i) { this.inHeap[i] = 1; hpush(this.heaps[this.color[i]], i, this.dist); }
  rebuild() {
    this.open.fill(0); this.inHeap.fill(0);
    for (const h of this.heaps) h.length = 0;
    const st = [];
    for (let i = 0; i < this.N; i++) if (!this.present[i] && this.border(i)) { this.open[i] = 1; st.push(i); }
    this.flood(st);
    for (let i = 0; i < this.N; i++) {
      if (this.present[i] && (this.border(i) || this.adjOpen(i))) {
        if (this.reserved[i]) this.inHeap[i] = 1; else this.push(i);
      }
    }
    this.ver++;
  }
  flood(st) {
    const W = this.W, N = this.N;
    while (st.length) {
      const a = st.pop(), x = a % W;
      const nb = [x > 0 ? a - 1 : -1, x < W - 1 ? a + 1 : -1, a >= W ? a - W : -1, a < N - W ? a + W : -1];
      for (const b of nb) {
        if (b < 0) continue;
        if (this.present[b]) { if (!this.inHeap[b] && !this.reserved[b]) this.push(b); }
        else if (!this.open[b]) { this.open[b] = 1; st.push(b); }
      }
    }
  }
  eat(i) {
    this.present[i] = 0; this.reserved[i] = 0;
    this.left[this.color[i]]--; this.total--; this.hash ^= this.z[i];
    this.open[i] = 1; this.flood([i]); this.ver++;
  }
  pop(c) { const h = this.heaps[c]; while (h.length) { const t = hpop(h, this.dist); if (this.present[t] && !this.reserved[t]) return t; } return -1; }
  peek(c) { const h = this.heaps[c]; while (h.length) { const t = h[0]; if (this.present[t] && !this.reserved[t]) return t; hpop(h, this.dist); } return -1; }
  reserve(t) { this.reserved[t] = 1; }
  unreserve(t) { this.reserved[t] = 0; if (this.present[t]) hpush(this.heaps[this.color[t]], t, this.dist); }
  removeColor(c) {
    for (let i = 0; i < this.N; i++) if (this.present[i] && this.color[i] === c) {
      this.present[i] = 0; this.reserved[i] = 0; this.left[c]--; this.total--; this.hash ^= this.z[i];
    }
    this.rebuild();
  }
  clone() {
    const b = Object.create(Board.prototype);
    b.W = this.W; b.H = this.H; b.N = this.N; b.nc = this.nc; b.color = this.color; b.dist = this.dist; b.z = this.z;
    b.present = this.present.slice(); b.reserved = this.reserved.slice(); b.open = this.open.slice(); b.inHeap = this.inHeap.slice();
    b.heaps = this.heaps.map(h => h.slice()); b.left = this.left.slice(); b.total = this.total; b.hash = this.hash; b.ver = 0;
    return b;
  }
}

// ---------- procedural pixel art ----------
function inTri(px, py, ax, ay, bx, by, cx, cy) {
  const d1 = (px - bx) * (ay - by) - (ax - bx) * (py - by);
  const d2 = (px - cx) * (by - cy) - (bx - cx) * (py - cy);
  const d3 = (px - ax) * (cy - ay) - (cx - ax) * (py - ay);
  return !((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0));
}
function ell(u, v, cx, cy, rx, ry, rot) {
  let x = u - cx, y = v - cy;
  if (rot) { const c = Math.cos(rot), s = Math.sin(rot); const nx = x * c + y * s; y = -x * s + y * c; x = nx; }
  return (x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = n >> 8 & 255, b = n & 255;
  if (amt < 0) { r *= 1 + amt; g *= 1 + amt; b *= 1 + amt; } else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return '#' + ((1 << 24) | (Math.round(r) << 16) | (Math.round(g) << 8) | Math.round(b)).toString(16).slice(1);
}

const THEMES = [
  { name: 'Heart', colors: r => { const m = rpick(r, ['#e8524a', '#ec6fa8', '#9b6bd6', '#ff8a3d']); return { main: m, light: shade(m, .6), dark: shade(m, -.32) }; },
    f(u, v) { const x = (u - .5) * 2.6, y = -(v - .54) * 2.6, a = x * x + y * y - 1; if (a * a * a - x * x * y * y * y > 0) return null; if ((x + .48) ** 2 + (y - .38) ** 2 < .07) return 'light'; if (x * .55 - y * .85 > .8) return 'dark'; return 'main'; } },
  { name: 'Fruit', colors: r => { const m = rpick(r, ['#e8524a', '#f39c34', '#8cc63f', '#f2c94c']); return { body: m, dark: shade(m, -.28), light: shade(m, .7), stem: '#7a4b2a', leaf: m === '#8cc63f' ? '#2e7d32' : '#43a047' }; },
    f(u, v) { if (u > .46 && u < .55 && v > .08 && v < .3) return 'stem'; if (ell(u, v, .67, .19, .14, .06, -.5)) return 'leaf'; if (!ell(u, v, .5, .6, .37, .35)) return null; if (v < .33 && Math.abs(u - .5) < .07) return null; if (ell(u, v, .36, .48, .075, .1)) return 'light'; if ((u - .5) * .7 + (v - .6) * .7 > .16) return 'dark'; return 'body'; } },
  { name: 'Kitty', colors: r => { const fur = rpick(r, ['#f0a35e', '#8d8d99', '#4a4a55', '#e9d8c0']); return { fur, light: fur === '#e9d8c0' ? '#ffffff' : shade(fur, .55), pink: '#f28fa6', eye: rpick(r, ['#43a047', '#3b82c4', '#f6c443']) }; },
    f(u, v) {
      const ear = s => inTri(u, v, .5 + s * .34, .48, .5 + s * .31, .1, .5 + s * .06, .32);
      const ein = s => inTri(u, v, .5 + s * .28, .42, .5 + s * .28, .19, .5 + s * .13, .33);
      if (ein(-1) || ein(1)) return 'pink';
      if (!ell(u, v, .5, .6, .35, .32) && !ear(-1) && !ear(1)) return null;
      if (ell(u, v, .37, .57, .065, .075) || ell(u, v, .63, .57, .065, .075)) return 'eye';
      if (inTri(u, v, .44, .66, .56, .66, .5, .72)) return 'pink';
      if (ell(u, v, .5, .75, .14, .075)) return 'light';
      return 'fur';
    } },
  { name: 'Fish', colors: r => { const b = rpick(r, ['#f39c34', '#4a90e2', '#e8524a', '#2bb3a3']); return { body: b, fin: shade(b, -.3), light: shade(b, .55), stripe: '#ffffff', eye: '#22223b' }; },
    f(u, v) { if (ell(u, v, .27, .46, .05, .055)) return 'eye'; if (ell(u, v, .46, .5, .33, .23)) { if (u > .4 && u < .62 && Math.abs(((u - .4) * 10) % 1 - .5) > .28) return 'stripe'; if (v > .58) return 'light'; return 'body'; } if (inTri(u, v, .72, .5, .97, .24, .97, .76) || inTri(u, v, .33, .3, .6, .31, .48, .14)) return 'fin'; return null; } },
  { name: 'Flower', colors: r => { const p = rpick(r, ['#ec6fa8', '#9b6bd6', '#e8524a', '#f6c443', '#4a90e2']); return { petal: p, light: shade(p, .5), center: p === '#f6c443' ? '#8d5a2b' : '#f6c443', stem: '#3f9b45', leaf: '#7cc85a' }; },
    f(u, v) { const dx = u - .5, dy = v - .38, rr = Math.hypot(dx, dy), th = Math.atan2(dy, dx); if (rr < .095) return 'center'; const rp = .31 * (.55 + .45 * Math.abs(Math.cos(2.5 * th))); if (rr < rp) return rr < rp * .55 ? 'light' : 'petal'; if (Math.abs(u - .5) < .035 && v > .6 && v < .97) return 'stem'; if (ell(u, v, .37, .8, .12, .05, .5) || ell(u, v, .63, .74, .12, .05, -.5)) return 'leaf'; return null; } },
  { name: 'Rocket', colors: r => { const n = rpick(r, ['#e8524a', '#4a90e2', '#9b6bd6']); return { body: '#eef1f5', nose: n, window: '#4fc3f7', frame: '#7d8799', flame: '#ff9f43', flame2: '#ffe066' }; },

    const w = from.w + (r.s * .8 - from.w) * k, h = from.h + (r.s * .62 - h0(from.h)) * k;
    const x = from.x + (r.x + (r.s - r.s * .8) / 2 - from.x) * k, y = from.y + (r.y + (r.s - r.s * .62) / 2 - from.y) * k - Math.sin(k * Math.PI) * 30;
    drawCube(g, x, y, w, h, c);
  }
  for (const p of confetti) { g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); }
  if (debug) {
    g.font = '600 11px ui-monospace,monospace'; g.textAlign = 'left'; g.textBaseline = 'top';
    const lines = []; for (const l of debugText.split('\n')) { let s = l; while (s.length > 52) { lines.push(s.slice(0, 52)); s = '  ' + s.slice(52); } lines.push(s); }
    g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(6, 6, CW - 12, lines.length * 14 + 10);
    g.fillStyle = '#7dffb0'; lines.forEach((l, i) => g.fillText(l, 12, 11 + i * 14));
  }
}
function h0(v) { return v; }

// ---------- effects ----------
function drainEvents() {
  const e = engine;
  while (e.events.length) {
    const ev = e.events.shift();
    if (ev.type === 'eat') {
      pops.push({ i: ev.i, t: 0 });
      const x = gx(ev.i % lv.W + .5), y = gy((ev.i / lv.W | 0) + .5);
      for (let k = 0; k < 3; k++) dust.push({ x, y, vx: (Math.random() - .5) * 60, vy: (Math.random() - .5) * 60 - 20, r: 1 + Math.random() * 2, life: .35 });
      if (!ev.quiet) Snd.pop();
    } else if (ev.type === 'tap') { Snd.click(); vib(12); }
    else if (ev.type === 'land') Snd.land();
    else if (ev.type === 'deliver') Snd.tick();
    else if (ev.type === 'done') { Snd.done(); layoutTrayIfNeeded(); }
    else if (ev.type === 'won') onWin();
    else if (ev.type === 'jam') { if (!jamShown) { jamShown = true; Snd.jam(); vib(200); setTimeout(showJam, 350); } }
  }
}
function layoutTrayIfNeeded() { if (LY && (LY.nc !== Math.max(1, engine.cols.length) || LY.sc !== engine.slotCount)) layout(); }
function onWin() {
  if (winDone) return; winDone = true; Snd.win(); vib(60);
  const cols = ['#ffc94d', '#ef5d5d', '#5fcf86', '#7fb6ff', '#ec6fa8', '#ffffff'];
  for (let k = 0; k < 140; k++) confetti.push({ x: CW / 2 + (Math.random() - .5) * 60, y: CH * .3, vx: (Math.random() - .5) * 520, vy: -200 - Math.random() * 420, r: Math.random() * 6, vr: (Math.random() - .5) * 12, s: 6 + Math.random() * 6, c: cols[k % cols.length], life: 2.2 });
  setTimeout(showWin, 1500);
}
function updateFx(dt) {
  for (let k = pops.length - 1; k >= 0; k--) { pops[k].t += dt; if (pops[k].t > .15) pops.splice(k, 1); }
  for (let k = dust.length - 1; k >= 0; k--) { const d = dust[k]; d.life -= dt; d.x += d.vx * dt; d.y += d.vy * dt; if (d.life <= 0) dust.splice(k, 1); }
  for (let k = confetti.length - 1; k >= 0; k--) { const p = confetti[k]; p.life -= dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .99; p.r += p.vr * dt; if (p.life <= 0 || p.y > CH + 20) confetti.splice(k, 1); }
}

// ---------- input ----------
cv.addEventListener('pointerdown', ev => {
  Snd.ensure(); if (!engine || paused) return;
  const r = cv.getBoundingClientRect(), x = ev.clientX - r.left, y = ev.clientY - r.top;
  if (mode && mode.k === 'pickup') {
    for (let si = 0; si < engine.slotCount; si++) {
      const s = slotRect(si);
      if (x >= s.x - 4 && x <= s.x + s.s + 4 && y >= s.y - 4 && y <= s.y + s.s + 4) {
        if (engine.pickUp(si)) { pay(mode.b); setMode(null); layoutTrayIfNeeded(); Snd.land(); vib(15); }
        return;
      }
    }
    return;
  }
  if (y >= LY.trayTop - 12 && y <= LY.trayBot + 4) {
    const ci = Math.floor((x - LY.colX0) / LY.colW);
    if (ci >= 0 && ci < engine.cols.length) {
      const res = engine.tap(ci);
      if (res === 'full') { Snd.shake(); vib(40); toast('All slots are full.'); }
      else if (res === 'locked') { Snd.shake(); vib(40); const c = engine.cols[ci][0]; toast(c && c.ropeFrom !== null && !engine.isLocked(c) ? 'Take the roped cube first.' : 'Locked until the cube in front of it finishes.'); }
    }
  }
});

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (engine && !paused) { engine.update(dt * (save.settings.fast ? 2 : 1)); drainEvents(); }
  updateFx(dt); draw(); requestAnimationFrame(frame);
}
save = loadSave();
window.addEventListener('resize', resize);
resize(); startLevel(save.level); requestAnimationFrame(frame);
</script>
</body>
